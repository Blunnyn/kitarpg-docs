name: Question
description: How to do something with KitARPG.
title: "[Question] "
labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What you want to do, and what you tried. Links to the pages you read help.
    validations:
      required: true
  - type: input
    id: kit
    attributes:
      label: KitARPG version
      placeholder: 1.0.0
  - type: dropdown
    id: mode
    attributes:
      label: How the game runs
      options:
        - Single player
        - MMO
        - Doesn't matter
