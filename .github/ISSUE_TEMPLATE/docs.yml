name: Documentation
description: A page is wrong, unclear, missing or badly translated.
title: "[Docs] "
labels: ["documentation"]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: The address of the page.
      placeholder: https://blunnyn.github.io/kitarpg-docs/en/content/items.html
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        - English
        - Español
        - Português
        - 中文
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's wrong
      description: What it says, and what it should say.
    validations:
      required: true
