name: Feature request
description: Something you would like KitARPG to have or do.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What you would like
      description: The feature, and the game you want to make with it.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What you can't do today, or what takes too long.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Examples
      description: Games that do it, or how it could look in the editor.
  - type: dropdown
    id: devkit
    attributes:
      label: Could the DevKit do it?
      description: Many things can be added without touching the kit. See the DevKit pages.
      options:
        - I don't know
        - No, it needs a change in the kit
        - Yes, but it would be useful in the kit
